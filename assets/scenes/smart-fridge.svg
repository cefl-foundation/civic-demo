<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500">
  <!-- The floor -->
  <rect x="0" y="462" width="560" height="38" fill="#F4F4F4"/>
  <line x1="0" y1="462" x2="560" y2="462" stroke="#D6D6D6" stroke-width="3"/>

  <!-- The fridge: body, the line between the two doors, handles, feet -->
  <rect x="70" y="30" width="250" height="428" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
  <line x1="70" y1="196" x2="320" y2="196" stroke="#000000" stroke-width="6"/>
  <rect x="288" y="70" width="12" height="96" rx="6" fill="#000000"/>
  <rect x="288" y="222" width="12" height="140" rx="6" fill="#000000"/>
  <rect x="92" y="458" width="32" height="10" rx="3" fill="#000000"/>
  <rect x="266" y="458" width="32" height="10" rx="3" fill="#000000"/>

  <!-- The screen on the top door -->
  <rect x="100" y="62" width="168" height="108" rx="10" fill="#0E6F73"/>
  <!-- a milk carton -->
  <path d="M116 94 l9 -12 h16 l9 12 v52 h-34 z" fill="#FFFFFF"/>
  <rect x="116" y="112" width="34" height="14" fill="#0E6F73" opacity="0.35"/>
  <text x="160" y="98" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">MILK</text>
  <text x="160" y="121" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">1 left</text>
  <text x="160" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF">Added to list</text>
  <!-- a wifi mark in the corner of the screen -->
  <circle cx="253" cy="80" r="3" fill="#FFFFFF"/>
  <path d="M245 73 a11 11 0 0 1 16 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M240 67 a18 18 0 0 1 26 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- A shopping note held on the bottom door by a red magnet -->
  <g transform="rotate(-4 160 280)">
    <rect x="112" y="236" width="104" height="112" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <line x1="126" y1="270" x2="200" y2="270" stroke="#5C5C5C" stroke-width="3"/>
    <line x1="126" y1="292" x2="188" y2="292" stroke="#5C5C5C" stroke-width="3"/>
    <line x1="126" y1="314" x2="196" y2="314" stroke="#5C5C5C" stroke-width="3"/>
    <circle cx="164" cy="240" r="9" fill="#C8102E"/>
  </g>

  <!-- The message leaving the fridge: three arcs -->
  <path d="M335.9 100.1 A14 14 0 0 1 335.9 119.9" fill="none" stroke="#0E6F73" stroke-width="5" stroke-linecap="round"/>
  <path d="M344.4 91.6 A26 26 0 0 1 344.4 128.4" fill="none" stroke="#0E6F73" stroke-width="5" stroke-linecap="round"/>
  <path d="M352.9 83.1 A38 38 0 0 1 352.9 136.9" fill="none" stroke="#0E6F73" stroke-width="5" stroke-linecap="round"/>

  <!-- The phone, with the message on its screen -->
  <rect x="392" y="150" width="136" height="252" rx="20" fill="#000000"/>
  <rect x="402" y="168" width="116" height="216" rx="9" fill="#FFFFFF"/>
  <rect x="440" y="157" width="40" height="5" rx="2.5" fill="#5C5C5C"/>
  <rect x="410" y="190" width="100" height="78" rx="9" fill="#F4F4F4" stroke="#0E6F73" stroke-width="3"/>
  <text x="420" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0E6F73">FRIDGE</text>
  <text x="420" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1B1B1B">Milk is on the</text>
  <text x="420" y="251" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1B1B1B">shopping list</text>
  <rect x="410" y="282" width="80" height="10" rx="5" fill="#D6D6D6"/>
  <rect x="410" y="302" width="96" height="10" rx="5" fill="#D6D6D6"/>
  <rect x="410" y="322" width="64" height="10" rx="5" fill="#D6D6D6"/>
</svg>

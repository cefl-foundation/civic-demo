<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="Arial, Helvetica, sans-serif">
  <!-- the paper of the map -->
  <rect width="640" height="580" rx="18" fill="#EEF1EE"/>
  <!-- green: the parks and tree belts round Milton Keynes, and the downs above Dunstable -->
  <g fill="#1E4D3A" opacity="0.9">
    <circle cx="170" cy="262" r="22"/>
    <circle cx="238" cy="252" r="16"/>
    <circle cx="150" cy="318" r="18"/>
    <circle cx="246" cy="330" r="20"/>
    <circle cx="198" cy="352" r="14"/>
    <circle cx="120" cy="286" r="12"/>
    <path d="M282 520 q30 -34 70 -28 q24 4 34 26 q-50 18 -104 2 z"/>
  </g>
  <!-- rivers: the Nene through Northampton, the Great Ouse through Bedford, the Lea from Luton -->
  <g fill="none" stroke="#9FB6C8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 120 C70 104 120 112 160 100 C210 84 250 52 300 30 C330 18 350 12 372 4"/>
    <path d="M90 236 C140 226 190 232 240 222 C300 210 340 236 400 222 C440 212 470 214 500 206 C550 192 590 176 640 164"/>
    <path d="M506 500 C520 520 530 540 556 580"/>
  </g>
  <!-- the A roads, in grey, each with a small label -->
  <g fill="none" stroke="#7A7F8C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 292 C300 270 380 230 470 202"/>
    <path d="M470 202 C500 290 506 380 500 486"/>
    <path d="M372 470 C310 410 260 350 205 292"/>
    <path d="M150 92 C260 120 380 150 470 202"/>
    <path d="M372 470 C420 476 460 484 500 486"/>
  </g>
  <!-- the M1, in navy, with a white line down the middle -->
  <path d="M560 580 C520 540 470 500 438 462 C400 418 340 372 290 330 C250 296 222 250 202 196 C188 156 184 128 178 104 C170 74 160 40 152 0" fill="none" stroke="#1E2761" stroke-width="13" stroke-linecap="round"/>
  <path d="M560 580 C520 540 470 500 438 462 C400 418 340 372 290 330 C250 296 222 250 202 196 C188 156 184 128 178 104 C170 74 160 40 152 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 8"/>
  <!-- road labels -->
  <g transform="translate(312 356)"><rect x="-16" y="-11" width="32" height="22" rx="4" fill="#1E2761"/><text x="0" y="5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">M1</text></g>
  <g transform="translate(330 238)"><rect x="-25" y="-11" width="50" height="22" rx="4" fill="#7A7F8C"/><text x="0" y="5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">A421</text></g>
  <g transform="translate(506 340)"><rect x="-16" y="-11" width="32" height="22" rx="4" fill="#7A7F8C"/><text x="0" y="5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">A6</text></g>
  <g transform="translate(262 392)"><rect x="-16" y="-11" width="32" height="22" rx="4" fill="#7A7F8C"/><text x="0" y="5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">A5</text></g>
  <g transform="translate(300 118)"><rect x="-25" y="-11" width="50" height="22" rx="4" fill="#7A7F8C"/><text x="0" y="5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">A428</text></g>
  <!-- the towns: a white dot with a black ring, and the name in capitals -->
  <circle cx="150" cy="92" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
  <text x="172" y="76" font-size="19" font-weight="700" letter-spacing="1" fill="#000000" text-anchor="start">NORTHAMPTON</text>
  <circle cx="205" cy="292" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
  <text x="183" y="272" font-size="19" font-weight="700" letter-spacing="1" fill="#000000" text-anchor="end">MILTON KEYNES</text>
  <circle cx="470" cy="202" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
  <text x="492" y="188" font-size="19" font-weight="700" letter-spacing="1" fill="#000000" text-anchor="start">BEDFORD</text>
  <circle cx="372" cy="470" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
  <text x="350" y="500" font-size="19" font-weight="700" letter-spacing="1" fill="#000000" text-anchor="end">DUNSTABLE</text>
  <circle cx="500" cy="486" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
  <text x="522" y="516" font-size="19" font-weight="700" letter-spacing="1" fill="#000000" text-anchor="start">LUTON</text>
  <!-- the case numbers, in red circles, as on the timeline -->
  <g font-size="17" font-weight="700" text-anchor="middle">
    <circle cx="481" cy="465" r="14" fill="#C8102E" stroke="#FFFFFF" stroke-width="3"/>
    <text x="481" y="471" fill="#FFFFFF">1</text>
    <circle cx="167" cy="109" r="14" fill="#C8102E" stroke="#FFFFFF" stroke-width="3"/>
    <text x="167" y="115" fill="#FFFFFF">2</text>
    <circle cx="222" cy="309" r="14" fill="#C8102E" stroke="#FFFFFF" stroke-width="3"/>
    <text x="222" y="315" fill="#FFFFFF">3</text>
    <circle cx="389" cy="487" r="14" fill="#C8102E" stroke="#FFFFFF" stroke-width="3"/>
    <text x="389" y="493" fill="#FFFFFF">4</text>
    <circle cx="487" cy="219" r="14" fill="#C8102E" stroke="#FFFFFF" stroke-width="3"/>
    <text x="487" y="225" fill="#FFFFFF">5</text>
  </g>
  <!-- north, and a reminder that it is not to scale -->
  <g transform="translate(46 50)"><path d="M0 -26 L10 4 L0 -2 L-10 4 Z" fill="#000000"/><text x="0" y="24" font-size="15" font-weight="700" text-anchor="middle">N</text></g>
  <text x="24" y="558" font-size="14" fill="#4A4F5C">Not to scale</text>
</svg>

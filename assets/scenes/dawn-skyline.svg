<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230">
  <!-- Dawn over Luton, from left to right: terraced houses, the Town Hall and its clock tower, St Mary's church with its chequered tower, more terraced houses, an old hat factory with its chimney and a works with a saw-tooth roof, Luton Airport Parkway station and the DART running up the hill to London Luton Airport (the terminal with its sign, the control tower and the tails of parked planes), and a plane climbing away. The Chiltern hills are behind the town. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B3A"/>
      <stop offset="0.4" stop-color="#3D2F66"/>
      <stop offset="0.72" stop-color="#B3647E"/>
      <stop offset="1" stop-color="#F6A55E"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E4A7A"/>
      <stop offset="1" stop-color="#3A2D5C"/>
    </linearGradient>
    <!-- the flint and stone chequer on St Mary's tower -->
    <pattern id="chequer" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#14142B"/>
      <rect width="3" height="3" fill="#25244A"/>
      <rect x="3" y="3" width="3" height="3" fill="#25244A"/>
    </pattern>
  </defs>

  <rect width="1280" height="230" fill="url(#sky)"/>
  <circle cx="470" cy="198" r="56" fill="#FFD27D" opacity="0.85"/>
  <g fill="#F4E6C1" opacity="0.8"><circle cx="940" cy="16" r="1.2"/><circle cx="1040" cy="30" r="1.4"/><circle cx="1160" cy="12" r="1.2"/><circle cx="1262" cy="32" r="1.4"/></g>

  <!-- the Chiltern hills, behind the town -->
  <path d="M0 178 C70 170 130 166 200 170 C270 174 320 182 380 180 C430 178 460 170 520 168 C590 166 640 176 700 180 C760 184 800 178 860 172 C930 165 1000 170 1070 174 C1140 178 1200 176 1280 172 V230 H0 Z" fill="url(#hills)"/>

  <!-- the ground in the town, and the hill the airport stands on -->
  <g fill="#14142B">
    <rect x="0" y="222" width="900" height="8"/>
    <path d="M800 230 C836 229 864 215 896 205 C918 199 944 196 980 196 H1280 V230 Z"/>
  </g>

